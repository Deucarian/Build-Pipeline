name: Pull package updates from Bitbucket

on:
  workflow_dispatch:
  schedule:
    - cron: "43 * * * *"
  workflow_run:
    workflows: ["Package Validation"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: bitbucket-package-synchronization
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: Deucarian/Package-Registry/.github/workflows/package-synchronization.yml@55fcd64c78f13d43ac55de13efa1cb8327846b08
    with:
      engine-ref: 55fcd64c78f13d43ac55de13efa1cb8327846b08
    secrets:
      BITBUCKET_READ_KEY: ${{ secrets.BITBUCKET_READ_KEY }}
      PACKAGE_SYNC_APP_PRIVATE_KEY: ${{ secrets.PACKAGE_SYNC_APP_PRIVATE_KEY }}
