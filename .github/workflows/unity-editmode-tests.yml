name: Unity EditMode Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: build-pipeline-editmode-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editmode:
    name: Unity 6000.0 EditMode
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out package
        uses: actions/checkout@v4

      - name: Create disposable Unity project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            TestProject/Assets \
            TestProject/Packages \
            TestProject/ProjectSettings
          cat > TestProject/Packages/manifest.json <<JSON
          {
            "dependencies": {
              "com.deucarian.build-pipeline": "file:${GITHUB_WORKSPACE}",
              "com.deucarian.editor": "https://github.com/Deucarian/Editor.git#develop",
              "com.deucarian.logging": "https://github.com/Deucarian/Logging.git#develop",
              "com.unity.test-framework": "1.4.6"
            },
            "testables": [
              "com.deucarian.build-pipeline"
            ]
          }
          JSON
          cat > TestProject/ProjectSettings/ProjectVersion.txt <<'TEXT'
          m_EditorVersion: 6000.0.40f1
          TEXT

      - name: Run Build Pipeline EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: TestProject
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          customParameters: -assemblyNames Deucarian.BuildPipeline.Editor.Tests
          artifactsPath: artifacts

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-pipeline-editmode-results
          path: artifacts
          if-no-files-found: warn
